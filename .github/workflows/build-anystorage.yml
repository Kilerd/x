name: Build AnyStorage Release

on:
  # API 触发（保留原有方式）
  repository_dispatch:
    types: [build-anystorage-release]

  # 手动触发（新增）
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.0.1-beta.7)'
        required: true
        type: string
      tag:
        description: 'Git tag name (e.g., v0.0.1-beta.7)'
        required: true
        type: string
      is_prerelease:
        description: 'Is this a prerelease?'
        required: true
        type: boolean
        default: true
      ref:
        description: 'Git ref to checkout (leave empty to use tag)'
        required: false
        type: string
      sha:
        description: 'Commit SHA (optional, for tracking)'
        required: false
        type: string
      release_notes:
        description: 'Release notes (optional, will read from tag annotation if empty)'
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      ref: ${{ steps.extract.outputs.ref }}
      sha: ${{ steps.extract.outputs.sha }}
      is_beta: ${{ steps.extract.outputs.is_beta }}
      release_notes: ${{ steps.get_notes.outputs.release_notes }}
    steps:
      - name: Extract payload data
        id: extract
        run: |
          # 判断触发方式并提取参数
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发：使用 inputs
            VERSION="${{ github.event.inputs.version }}"
            TAG="${{ github.event.inputs.tag }}"
            IS_PRERELEASE="${{ github.event.inputs.is_prerelease }}"
            REF="${{ github.event.inputs.ref }}"
            SHA="${{ github.event.inputs.sha }}"
            RELEASE_NOTES="${{ github.event.inputs.release_notes }}"

            # 如果 ref 为空，使用 tag 作为 ref
            if [ -z "$REF" ]; then
              REF="$TAG"
            fi

            # 如果 sha 为空，设置为 N/A
            if [ -z "$SHA" ]; then
              SHA="N/A"
            fi

            echo "🖱️  Manual workflow trigger"
          else
            # API 触发：使用 client_payload
            VERSION="${{ github.event.client_payload.version }}"
            TAG="${{ github.event.client_payload.tag }}"
            IS_PRERELEASE="${{ github.event.client_payload.is_prerelease }}"
            REF="${{ github.event.client_payload.ref }}"
            SHA="${{ github.event.client_payload.sha }}"
            RELEASE_NOTES="${{ github.event.client_payload.release_notes }}"

            echo "🔗 Repository dispatch trigger"
          fi

          # 检查是否为 beta 版本
          if [[ "$VERSION" == *"beta"* ]]; then
            IS_BETA="true"
            echo "⚠️  Beta version detected - Windows build will be skipped"
          else
            IS_BETA="false"
          fi

          # 输出到 GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "is_beta=$IS_BETA" >> $GITHUB_OUTPUT

          # release_notes 可能是多行，使用 heredoc
          echo "input_release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # 显示构建信息
          echo "📦 Building AnyStorage Tauri $VERSION"
          echo "🏷️  Tag: $TAG"
          echo "🔖 Prerelease: $IS_PRERELEASE"
          echo "🔖 Beta: $IS_BETA"
          echo "📍 Ref: $REF"
          echo "📍 SHA: $SHA"

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: kilerd/anystorage-tauri
          ref: ${{ steps.extract.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Get release notes from tag annotation
        id: get_notes
        run: |
          TAG="${{ steps.extract.outputs.tag }}"
          INPUT_NOTES="${{ steps.extract.outputs.input_release_notes }}"

          # 如果已经提供了 release_notes，直接使用
          if [ -n "$INPUT_NOTES" ]; then
            echo "📝 Using provided release notes"
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "$INPUT_NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 尝试从 tag annotation 读取
          echo "📝 Reading release notes from tag annotation: $TAG"

          # 获取 tag annotation（跳过第一行的 tag 名称）
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || echo "")

          if [ -n "$TAG_MESSAGE" ]; then
            echo "✅ Found tag annotation"
            echo "release_notes<<EOF" >> $GITHUB_OUTPUT
            echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "⚠️  No tag annotation found, release notes will be empty"
            echo "release_notes=" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: 'macos-latest'
            os_label: 'mac'
            arch: 'aarch64'
            target: 'aarch64-apple-darwin'
            skip_on_beta: false
          # macOS Intel
          - platform: 'macos-15-intel'
            os_label: 'mac'
            arch: 'x86_64'
            target: 'x86_64-apple-darwin'
            skip_on_beta: false
          # Windows x64
          - platform: 'windows-latest'
            os_label: 'win'
            arch: 'x86_64'
            target: 'x86_64-pc-windows-msvc'
            skip_on_beta: true
          # Linux x64
          - platform: 'ubuntu-22.04'
            os_label: 'linux'
            arch: 'x86_64'
            target: 'x86_64-unknown-linux-gnu'
            skip_on_beta: false

    steps:
      - name: Check if build should be skipped
        id: should_skip
        shell: bash
        run: |
          if [[ "${{ matrix.skip_on_beta }}" == "true" && "${{ needs.prepare.outputs.is_beta }}" == "true" ]]; then
            echo "⚠️  Skipping Windows build for beta version"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout private repository
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: kilerd/anystorage-tauri
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node.js
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: steps.should_skip.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: steps.should_skip.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        if: steps.should_skip.outputs.skip != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # 在构建前自动将 tag 版本号写入 tauri.conf.json
      # 开发环境保持 0.1.0，发版时动态设置正确版本
      - name: Install jq (Windows only)
        if: steps.should_skip.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: choco install jq -y

      - name: Update version in tauri.conf.json
        if: steps.should_skip.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          echo "📝 Updating Tauri version to $VERSION"

          # Update tauri.conf.json
          jq --arg version "$VERSION" '.version = $version' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

          echo "✅ Updated version to $VERSION in src-tauri/tauri.conf.json"

      - name: Verify version update
        if: steps.should_skip.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Windows: 使用 PowerShell 读取 JSON
            TAURI_VERSION=$(powershell -Command "(Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version")
          else
            # macOS/Linux: 使用 jq
            TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          fi

          echo "📋 Version check:"
          echo "   Expected:                  $VERSION"
          echo "   src-tauri/tauri.conf.json: $TAURI_VERSION"

          if [ "$TAURI_VERSION" != "$VERSION" ]; then
            echo "❌ Version update failed! Tauri version does not match."
            exit 1
          fi

          echo "✅ Version verification passed"

      - name: Install frontend dependencies
        if: steps.should_skip.outputs.skip != 'true'
        run: npm install

      # macOS 代码签名：导入证书到钥匙链
      - name: Import Apple Developer Certificate
        if: steps.should_skip.outputs.skip != 'true' && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "🔐 Importing Apple Developer Certificate..."

          # 解码证书
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12

          # 创建临时钥匙链
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # 导入证书
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # 允许 codesign 使用证书
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # 清理证书文件
          rm certificate.p12

          echo "✅ Certificate imported successfully"

      # macOS 代码签名：提取证书 Identity
      - name: Extract Certificate Identity
        if: steps.should_skip.outputs.skip != 'true' && runner.os == 'macOS'
        run: |
          # 从钥匙链中查找证书完整名称（而不是 SHA-1 哈希）
          CERT_NAME=$(security find-identity -v -p codesigning build.keychain | \
            grep "Developer ID Application" | \
            head -1 | \
            sed -n 's/.*"\(.*\)"/\1/p')

          if [ -z "$CERT_NAME" ]; then
            echo "❌ Failed to extract certificate identity"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERT_NAME" >> $GITHUB_ENV
          echo "✅ Certificate Identity: $CERT_NAME"

      - name: Build Tauri application
        if: steps.should_skip.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater 签名
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 代码签名和公证
          APPLE_CERTIFICATE: ${{ secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: '.'
          args: '--target ${{ matrix.target }}'
          # 不直接发布到 release，只生成构建产物
          tagName: ''
          releaseName: ''
          releaseBody: ''
          releaseDraft: true
          # Updater 配置
          includeUpdaterJson: false
          updaterJsonKeepUniversal: false

      # Rename macOS .app.tar.gz to include architecture
      - name: Rename macOS artifacts to include architecture
        if: steps.should_skip.outputs.skip != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"

          # 查找 .app.tar.gz 文件
          APP_TAR=$(find "$BUNDLE_DIR" -name "*.app.tar.gz" -not -name "*_${{ matrix.arch }}.app.tar.gz" | head -1)

          if [ -n "$APP_TAR" ]; then
            # 提取文件名和目录
            DIR=$(dirname "$APP_TAR")
            BASENAME=$(basename "$APP_TAR" .app.tar.gz)

            # 重命名为包含架构的名称
            NEW_NAME="${BASENAME}_${{ matrix.arch }}.app.tar.gz"
            mv "$APP_TAR" "$DIR/$NEW_NAME"

            # 同时重命名签名文件
            if [ -f "${APP_TAR}.sig" ]; then
              mv "${APP_TAR}.sig" "$DIR/${NEW_NAME}.sig"
            fi

            echo "✅ Renamed: $(basename $APP_TAR) → $NEW_NAME"
          fi

      - name: Upload artifacts
        if: steps.should_skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_label }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb.sig
          retention-days: 7
          if-no-files-found: error

  generate-updater-json:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    outputs:
      updater_json: ${{ steps.generate.outputs.json }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Updater JSON
        id: generate
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NOTES="Release $VERSION"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IS_BETA="${{ needs.prepare.outputs.is_beta }}"

          echo "📦 Generating updater JSON for version $VERSION"

          # 初始化 JSON
          cat > latest.json << 'JSONEOF'
          {
            "version": "VERSION_PLACEHOLDER",
            "notes": "NOTES_PLACEHOLDER",
            "pub_date": "DATE_PLACEHOLDER",
            "platforms": {}
          }
          JSONEOF

          # 替换占位符
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" latest.json
          sed -i "s/NOTES_PLACEHOLDER/$NOTES/g" latest.json
          sed -i "s/DATE_PLACEHOLDER/$PUB_DATE/g" latest.json

          # 处理每个平台
          process_platform() {
            local os=$1
            local arch=$2
            local platform_key="darwin"
            if [ "$os" = "win" ]; then
              platform_key="windows"
            elif [ "$os" = "linux" ]; then
              platform_key="linux"
            fi
            local platform="${platform_key}-${arch}"
            local artifact_dir="artifacts/release-${os}-${arch}"

            echo "🔍 Processing platform: $platform (artifact_dir: $artifact_dir)"

            if [ ! -d "$artifact_dir" ]; then
              echo "⚠️  Artifact directory not found: $artifact_dir"
              return
            fi

            # 查找安装包和签名
            INSTALLER=""
            if [ "$os" = "mac" ]; then
              INSTALLER=$(find "$artifact_dir" -name "*.app.tar.gz" -not -name "*.sig" 2>/dev/null | head -1)
            elif [ "$os" = "win" ]; then
              INSTALLER=$(find "$artifact_dir" -name "*.msi" -o -name "*-setup.exe" 2>/dev/null | grep -v "\.sig$" | head -1)
            elif [ "$os" = "linux" ]; then
              INSTALLER=$(find "$artifact_dir" -name "*.AppImage" 2>/dev/null | grep -v "\.sig$" | head -1)
            fi

            if [ -z "$INSTALLER" ]; then
              echo "⚠️  No installer found for $platform"
              ls -la "$artifact_dir" || true
              return
            fi

            echo "✅ Found installer: $INSTALLER"

            SIG_FILE="${INSTALLER}.sig"

            if [ ! -f "$SIG_FILE" ]; then
              echo "❌ Signature file not found: $SIG_FILE"
              return
            fi

            # 读取签名内容
            SIGNATURE=$(cat "$SIG_FILE")
            FILENAME=$(basename "$INSTALLER")
            DOWNLOAD_URL="https://github.com/kilerd/anystorage-release/releases/download/${{ needs.prepare.outputs.tag }}/${FILENAME}"

            echo "📝 Adding platform $platform with file $FILENAME"

            # 使用 jq 添加平台信息
            jq --arg platform "$platform" \
               --arg url "$DOWNLOAD_URL" \
               --arg sig "$SIGNATURE" \
               '.platforms[$platform] = {"signature": $sig, "url": $url}' \
               latest.json > latest.json.tmp
            mv latest.json.tmp latest.json

            echo "✅ Added $platform to updater JSON"
          }

          # 处理所有平台
          process_platform "mac" "aarch64"
          process_platform "mac" "x86_64"
          process_platform "linux" "x86_64"

          # Windows 仅在非 beta 时处理
          if [ "$IS_BETA" != "true" ]; then
            process_platform "win" "x86_64"
          fi

          # 输出最终 JSON
          echo "📄 Generated updater JSON:"
          cat latest.json

      - name: Upload updater JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-json
          path: latest.json
          retention-days: 7

  release:
    needs: [prepare, build, generate-updater-json]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          IS_BETA="${{ needs.prepare.outputs.is_beta }}"
          RELEASE_NOTES="${{ needs.prepare.outputs.release_notes }}"

          # 构建 release body
          VERSION="${{ needs.prepare.outputs.version }}"

          {
            echo "# AnyStorage $VERSION"
            echo ""
            # What's New 部分
            if [ -n "$RELEASE_NOTES" ]; then
              echo "## What's New"
              echo ""
              echo "$RELEASE_NOTES"
              echo ""
            fi
            echo "## Platforms"
            echo ""
            echo "- macOS Apple Silicon (ARM64)"
            echo "- macOS Intel (x86_64)"
            if [ "$IS_BETA" != "true" ]; then
              echo "- Windows x64"
            fi
            echo "- Linux x64 (AppImage, Deb)"
            echo ""
            if [ "$IS_BETA" == "true" ]; then
              echo "⚠️ **Note:** Windows build is not available for beta versions."
              echo ""
            fi
            echo "## Auto Update"
            echo ""
            echo "This release includes \`latest.json\` for Tauri auto-updater support. Installed apps will automatically detect and download updates."
            echo ""
            echo "## Download"
            echo ""
            echo "Download the appropriate installer for your platform below."
            echo ""
            echo "For more information, visit the [main repository](https://github.com/Kilerd/anystorage-release)."
          } > /tmp/release_body.md

          # 使用多行输出
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Collect artifacts (non-beta)
        if: needs.prepare.outputs.is_beta != 'true'
        run: |
          mkdir -p release-files

          echo "📦 Collecting artifacts for all platforms..."

          # macOS ARM64
          find artifacts/release-mac-aarch64/ -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # macOS Intel
          find artifacts/release-mac-x86_64/ -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # Windows
          find artifacts/release-win-x86_64/ -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # Linux
          find artifacts/release-linux-x86_64/ -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # Updater JSON
          cp artifacts/updater-json/latest.json release-files/ 2>/dev/null || echo "⚠️  latest.json not found"

          echo "✅ Collected files:"
          ls -lh release-files/

      - name: Collect artifacts (beta - no Windows)
        if: needs.prepare.outputs.is_beta == 'true'
        run: |
          mkdir -p release-files

          echo "📦 Collecting artifacts for beta (no Windows)..."

          # macOS ARM64
          find artifacts/release-mac-aarch64/ -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # macOS Intel
          find artifacts/release-mac-x86_64/ -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # Linux
          find artifacts/release-linux-x86_64/ -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \) -exec cp {} release-files/ \; 2>/dev/null || true

          # Updater JSON
          cp artifacts/updater-json/latest.json release-files/ 2>/dev/null || echo "⚠️  latest.json not found"

          echo "✅ Collected files:"
          ls -lh release-files/

      - name: Create GitHub Release in anystorage-release repository
        uses: softprops/action-gh-release@v2
        with:
          name: AnyStorage ${{ needs.prepare.outputs.version }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          repository: kilerd/anystorage-release
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          draft: false
          generate_release_notes: false
          body: ${{ steps.release_body.outputs.body }}
          files: release-files/*
          fail_on_unmatched_files: true

      - name: Release complete
        run: |
          echo "✅ Release ${{ needs.prepare.outputs.tag }} published to anystorage-release repository"
          echo "🔗 https://github.com/kilerd/anystorage-release/releases/tag/${{ needs.prepare.outputs.tag }}"
          if [ "${{ needs.prepare.outputs.is_beta }}" == "true" ]; then
            echo "⚠️  Beta version: Windows build was skipped"
          fi

      - name: Sync release to website
        run: |
          echo "🔄 Syncing release to website..."
          HTTP_STATUS=$(curl -s -o /tmp/sync_response.txt -w "%{http_code}" \
            -X GET "https://anystorage.dev/api/cron/sync-release")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Website sync completed successfully"
            cat /tmp/sync_response.txt
          else
            echo "⚠️  Website sync returned HTTP $HTTP_STATUS (non-fatal)"
            cat /tmp/sync_response.txt
          fi
